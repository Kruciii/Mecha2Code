<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MechaCode</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="#">Mecha<span>Code</span></a>
    <div class="top-actions"><form id="login-form" class="login-form"><input id="login-email" type="email" placeholder="email" required><input id="login-password" type="password" placeholder="hasło" required><button class="login-button" type="submit">Zaloguj</button></form><button id="logout-button" class="login-button d-none">Wyloguj</button><button id="theme-button" class="icon-button" title="Zmień motyw">☼</button><span class="avatar">A</span></div>
  </nav>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-title">ZADANIA <span id="task-count">0</span></div>
      <div class="filters"><button class="filter active">Wszystkie</button><button class="filter">Łatwe</button><button class="filter">Średnie</button></div>
      <div id="task-list" class="task-list"><div class="loading">Ładowanie zadań...</div></div>
    </aside>
    <main class="workspace">
      <div id="alert" class="alert d-none" role="alert"></div>
      <div class="split-view">
        <section class="problem-panel">
          <div class="panel-tabs"><button class="panel-tab active">Opis</button><button class="panel-tab">Rozwiązania</button><button class="panel-tab">Historia</button></div>
          <div class="problem-content">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div><h1 id="task-title">Wybierz zadanie</h1><span id="task-difficulty" class="difficulty easy">ŁATWE</span></div>
              <button id="refresh-button" class="icon-button" title="Odśwież zadania">↻</button>
            </div>
            <div id="task-description" class="description"><p>Wybierz zadanie z listy, aby zobaczyć jego treść.</p></div>
            <div class="examples"><h2>Przykład</h2><pre id="task-example">Wejście:  wybierz zadanie
Wyjście: rozwiązanie</pre></div>
            <div class="constraints"><h2>Ograniczenia</h2><ul><li>Kod zostanie wysłany do sprawdzenia.</li><li>Limit czasu i pamięci znajdziesz powyżej.</li></ul></div>
          </div>
        </section>
        <section class="editor-panel">
          <div class="editor-toolbar"><select id="language"><option value="54">C++ (GCC 9.2.0)</option><option value="71">Python (3.8.1)</option><option value="62">Java (JDK 13.0.1)</option></select><button id="reset-code" class="toolbar-button">Resetuj</button></div>
          <textarea id="source-code" spellcheck="false">#include &lt;iostream&gt;
using namespace std;

int main() {
    // Napisz swoje rozwiązanie tutaj
    return 0;
}</textarea>
          <div class="editor-footer"><span>⌘ Enter, aby wysłać</span><div><button id="run-button" class="btn btn-outline-light">Uruchom</button><button id="submit-button" class="btn btn-success">Wyślij rozwiązanie</button></div></div>
        </section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
